<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Biblioteca Escolar</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="login-screen">
    <div class="login-card">
      <div class="login-brand">
        <span class="dot"></span>
        <span>Biblioteca<span style="color: var(--accent-blue);">.sys</span></span>
      </div>

      <h1>Acessar o sistema</h1>
      <p class="sub">Entre com seu login de funcionário ou aluno.</p>

      <div class="login-error" id="login-error"></div>

      <form class="login-form" id="login-form">
        <div class="field">
          <label for="login">Login</label>
          <input type="text" id="login" name="login" placeholder="Login" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" placeholder="Senha" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Entrar</button>
      </form>

      <p class="sub" style="margin-top: 18px; margin-bottom: 0; text-align: center;">
        É aluno e ainda não tem conta? <a href="/html/cadastroaluno.html" style="color: var(--accent-blue); font-weight: 600;">Criar conta</a>
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
